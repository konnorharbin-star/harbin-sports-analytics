name: CFB Market-Error Research

on:
  workflow_dispatch:
  schedule:
    - cron: '13 18 * * 6'

permissions:
  contents: read

jobs:
  chronological-market-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Run leakage and research-only tests
        run: python -m pytest -q tests/test_market_error_challenger.py
      - name: Reconstruct matched archived opening moneylines
        run: python -m scripts.build_cfb_moneyline_diagnostic --out /tmp/cfb_paired_research.csv
      - name: Fit on 2023, select on 2024, evaluate on 2025
        run: |
          python -m scripts.market_error_challenger \
            --historical /tmp/cfb_paired_research.csv \
            --out reports/market_error_challenger.json
      - name: Report actual matched-game metrics
        shell: bash
        run: |
          echo "### Retrospective market-error challenger" >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a research-only, previously inspected historical sample—not an untouched holdout.' >> "$GITHUB_STEP_SUMMARY"
          cat reports/market_error_challenger.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-market-challenger-${{ github.run_id }}
          path: |
            reports/market_error_challenger.json
          if-no-files-found: warn
          retention-days: 60

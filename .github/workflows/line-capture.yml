name: CFB Market Line Capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = auto-detect)"
        required: false
        default: ""
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: cfb-line-capture
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture current markets
        shell: bash
        run: |
          ARGS=""
          [ -n "${{ inputs.season }}" ] && ARGS="$ARGS --season ${{ inputs.season }}"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          python capture_lines.py $ARGS
      - name: Compare captured identical-line prices
        run: python -m scripts.price_comparison_scan --sport cfb --out docs/price_comparison_scan_line.json
      - name: Commit line history
        shell: bash
        run: |
          git config user.name "harbin-line-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f history/market_snapshots.csv ] && git add history/market_snapshots.csv || true
          git add history/price_scan_v1 docs/price_comparison_scan_line.json
          [ -f outputs/line_capture_status.json ] && git add outputs/line_capture_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "lines: capture verified pre-kickoff market snapshot"
            bash scripts/push_generated_state.sh
          else
            echo "No material line changes or heartbeat snapshot due."
          fi

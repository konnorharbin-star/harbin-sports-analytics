name: Walters Matchup Residual Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated research regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_walters_matchup_residual.py
      - name: Grade strict prior-week matchup features
        run: |
          python scripts/walters_matchup_residual.py --sport cfb --source reports/backtest_predictions.csv --out reports/walters_matchup_residual.json
      - uses: actions/upload-artifact@v4
        with:
          name: walters-matchup-retrospective
          path: reports/walters_matchup_residual.json

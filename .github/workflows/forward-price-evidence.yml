name: Forward Price Evidence Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/forward_price_validation.py"
      - "tests/test_forward_price_validation.py"
      - ".github/workflows/forward-price-evidence.yml"

permissions:
  contents: read

jobs:
  forward-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Isolated fail-closed tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_forward_price_validation.py
      - name: Audit archived sources and immutable prospective paper receipts
        run: |
          python scripts/forward_price_validation.py --out reports/forward_price_evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: forward-price-evidence-research
          path: reports/forward_price_evidence.json

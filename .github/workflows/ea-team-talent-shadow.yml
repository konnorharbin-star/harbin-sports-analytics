name: CFB EA Team Talent Shadow Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "research/ea_team_prior/**"
      - "tests/test_ea_team_prior.py"
      - ".github/workflows/ea-team-talent-shadow.yml"
  push:
    branches: [main]
    paths:
      - "research/ea_team_prior/**"
      - "tests/test_ea_team_prior.py"
      - ".github/workflows/ea-team-talent-shadow.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install pytest
      - name: Test coverage, source format and chronology guards
        run: python -m pytest -q tests/test_ea_team_prior.py
      - name: Audit 2026 graded, archived baseline without fitting a challenger
        run: |
          python research/ea_team_prior/audit.py \
            --sport cfb \
            --ratings research/ea_team_prior/team_ratings_2026.csv \
            --metadata research/ea_team_prior/source_metadata.json \
            --games reports/live_graded_predictions.csv \
            --output reports/ea_team_prior_audit.json \
            --rows-output reports/ea_team_prior_residual_rows.csv
      - name: Publish research status (not a betting output)
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("reports/ea_team_prior_audit.json"))
          print("## CFB EA preseason team ratings (research only)")
          print(f"- 2026 pregame graded matches: {r['matched_games']}/{r['eligible_pregame_graded_games']}")
          print(f"- Coverage: {100*r['coverage']:.1f}%")
          print(f"- Baseline margin MAE: {r['base_margin_mae']}")
          print(f"- Baseline total MAE: {r['base_total_mae']}")
          print(f"- Rating vs baseline margin residual correlation: {r['talent_residual_margin_corr']}")
          print(f"- Missing team IDs: {r['missing_team_ids']}")
          print("- Ratings **are team level**, not individual-player ratings.")
          print("- No validated improvement, no challenger forecast, no live wager adjustment.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ea-27-cfb-team-prior-audit
          path: |
            reports/ea_team_prior_audit.json
            reports/ea_team_prior_residual_rows.csv
          retention-days: 30

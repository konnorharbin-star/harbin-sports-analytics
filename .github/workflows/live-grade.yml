name: CFB Live Shadow Grading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "history/**"
      - "harbin/grading.py"
      - "harbin/edge_forward.py"
      - "harbin/edge_regimes.py"
      - "harbin/tier_validation.py"
      - "grade_live.py"
      - ".github/workflows/live-grade.yml"
  schedule:
    - cron: "37 10,16,22 * * *"
permissions:
  contents: write
concurrency:
  group: cfb-live-grade
  cancel-in-progress: true
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_live_grading.py tests/test_line_history.py tests/test_edge_regimes.py tests/test_edge_forward.py
      - name: Grade completed paper/shadow bets
        run: python grade_live.py
      - name: Commit live evidence
        shell: bash
        run: |
          git config user.name "harbin-grade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in reports/live_performance.json reports/live_graded_predictions.csv reports/live_graded_bets.csv reports/tier_performance.json reports/tier_performance.csv reports/tier_validation_clean.csv reports/live_graded_tiers.csv reports/live_graded_tiers_clean.csv outputs/live_performance.json outputs/tier_performance.json outputs/tier_performance.csv outputs/tier_validation_clean.csv outputs/live_graded_tiers.csv outputs/live_graded_tiers_clean.csv reports/edge_forward_performance.json reports/edge_forward_graded.csv outputs/edge_forward_performance.json outputs/edge_forward_graded.csv docs/live_performance.json docs/tier_performance.json docs/tier_performance.csv docs/tier_validation_clean.csv docs/live_graded_tiers.csv docs/live_graded_tiers_clean.csv docs/edge_forward_performance.json docs/edge_forward_graded.csv; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "grade: refresh independent live shadow evidence"
            git pull --rebase origin main
            git push
          else
            echo "No new completed bets to grade."
          fi

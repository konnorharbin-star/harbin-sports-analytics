name: Walters Key Number Prospective Shadow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/walters_key_forward.py"
      - "tests/test_walters_key_forward.py"
      - ".github/workflows/walters-key-forward.yml"
  schedule:
    - cron: "22 10,16,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: walters-key-forward-cfb-main
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test chronology and immutable shadow
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_walters_key_forward.py
      - name: Freeze pregame 2026 distributions and grade published finals
        run: |
          python scripts/walters_key_forward.py --sport cfb --historical reports/backtest_predictions.csv
      - name: Upload research-only prospective evidence
        uses: actions/upload-artifact@v4
        with:
          name: walters-key-forward-cfb
          path: |
            reports/walters_key_forward.json
            history/walters_key_forward_v1/forecasts/*.json
          if-no-files-found: warn
      - name: Commit first-published shadow and graded research
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-key-shadow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/walters_key_forward_v1/forecasts reports/walters_key_forward.json
          if git diff --cached --quiet; then
            echo "No new forward evidence"
          else
            git commit -m "research: freeze Walters key-number forward evidence"
            git push origin HEAD:main
          fi

name: Walters Key Number Prospective Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/walters_key_forward.py"
      - "scripts/walters_key_market_gate.py"
      - "tests/test_walters_key_market_gate.py"
      - "scripts/therundown_free_watch.py"
      - "tests/test_therundown_free_watch.py"
      - ".github/workflows/walters-key-forward.yml"
  pull_request:
    paths:
      - "scripts/walters_key_forward.py"
      - "tests/test_walters_key_forward.py"
      - ".github/workflows/walters-key-forward.yml"

permissions:
  contents: read

concurrency:
  group: walters-key-forward-review-cfb-main
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test chronology and immutable shadow
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_walters_key_forward.py
          python -m pytest -q tests/test_walters_key_market_gate.py
          python -m pytest -q tests/test_therundown_free_watch.py
      - name: Freeze pregame 2026 distributions and grade published finals
        run: |
          python -m scripts.walters_key_forward --sport cfb --historical reports/backtest_predictions.csv
      - name: Audit source-attested exact spread prices
        run: python -m scripts.walters_key_market_gate
      - name: Upload research-only prospective evidence
        uses: actions/upload-artifact@v4
        with:
          name: walters-key-forward-cfb
          path: |
            reports/walters_key_forward.json
            reports/walters_key_market_gate.json
            history/walters_key_forward_v1/forecasts/*.json
          if-no-files-found: warn

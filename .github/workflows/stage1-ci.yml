name: Stage 1 Data Feature Validation

on:
  push:
    branches: [stage1-data-features-v2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Full Week 5 smoke run
        run: python run_week.py --season 2026 --week 5

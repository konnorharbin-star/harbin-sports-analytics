name: CFB Walk-Forward Backtest

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First evaluation season"
        required: false
        default: "2023"
      end_season:
        description: "Last evaluation season"
        required: false
        default: "2025"
      history_start:
        description: "First training season"
        required: false
        default: "2018"
  push:
    branches: [main]
    paths:
      - "harbin/**"
      - "run_backtest.py"
      - "requirements.txt"
      - ".github/workflows/cfb-backtest.yml"
  schedule:
    - cron: "35 15 * * 1"
permissions:
  contents: write
concurrency:
  group: cfb-backtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
      HARBIN_FAST_BACKTEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run leakage-safe backtest + policy calibration
        shell: bash
        run: |
          python run_backtest.py \
            --start-season "${{ inputs.start_season || '2023' }}" \
            --end-season "${{ inputs.end_season || '2025' }}" \
            --history-start "${{ inputs.history_start || '2018' }}"
          mkdir -p docs
          cp reports/backtest_summary.json docs/backtest_summary.json
          cp reports/evidence_report.json docs/evidence.json
          cp reports/production_policy.json docs/policy.json
          cp reports/edge_regimes.json docs/edge_regimes.json
          cp reports/edge_regimes.csv docs/edge_regimes.csv
      - name: Backtest summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("reports/backtest_summary.json")); o=m["overall"]; e=json.load(open("reports/evidence_report.json")); p=json.load(open("reports/production_policy.json")); r=json.load(open("reports/edge_regimes.json"))
          pct=lambda x:"n/a" if x is None else f"{x:.2%}"
          print(f"## CFB Walk-Forward Backtest — {m['start_season']}-{m['end_season']}")
          print(f"- Bets: **{o['bets']}** · ROI: **{pct(o['roi'])}** · Units: **{o['units']:.2f}**")
          print(f"- Win rate: **{pct(o['win_rate'])}** · Max drawdown: **{o['max_drawdown']:.2f}u**")
          print(f"- Normalized CLV: **{pct(o['avg_clv'])}** over **{o['clv_samples']}** samples")
          print(f"- Week-block ROI 95% CI: **{o['roi_ci_95']}**")
          print(f"- Evidence: **{e['status']}** · Deployment mode: **{p['deployment_mode']}**")
          print(f"- Edge regimes: **{r.get('persistent_regimes',0)} persistent candidates** · **{r.get('watch_regimes',0)} watch**")
          PY
      - name: Commit reports
        shell: bash
        run: |
          git config user.name "harbin-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs/backtest_summary.json docs/evidence.json docs/policy.json docs/edge_regimes.json docs/edge_regimes.csv
          if ! git diff --cached --quiet; then
            git commit -m "backtest: refresh evidence and production policy"
            git pull --rebase origin main
            git push
          else
            echo "No backtest report changes to commit."
          fi

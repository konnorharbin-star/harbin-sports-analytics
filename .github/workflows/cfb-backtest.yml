name: CFB Walk-Forward Backtest

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First evaluation season"
        required: false
        default: "2023"
      end_season:
        description: "Last evaluation season"
        required: false
        default: "2025"
      history_start:
        description: "First training season"
        required: false
        default: "2018"
  schedule:
    - cron: "35 15 * * 1"

permissions:
  contents: write

concurrency:
  group: cfb-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run leakage-safe backtest
        shell: bash
        run: |
          python run_backtest.py \
            --start-season "${{ inputs.start_season || '2023' }}" \
            --end-season "${{ inputs.end_season || '2025' }}" \
            --history-start "${{ inputs.history_start || '2018' }}"
      - name: Backtest summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("reports/backtest_summary.json")); o=m["overall"]; p=m["prediction"]
          print(f"## CFB Walk-Forward Backtest — {m['start_season']}-{m['end_season']}")
          print(f"- Bets: **{o['bets']}** · ROI: **{o['roi']:.2%}** · Units: **{o['units']:.2f}**")
          print(f"- Win rate: **{o['win_rate']:.2%}** · Max drawdown: **{o['max_drawdown']:.2f}u**")
          print(f"- Avg CLV proxy: **{o['avg_clv']}** over **{o['clv_samples']}** samples")
          print(f"- ROI 95% bootstrap CI: **{o['roi_ci_95']}**")
          print(f"- Prediction margin / total MAE: **{p.get('margin_mae')} / {p.get('total_mae')}**")
          print(f"- Brier / ECE: **{p.get('brier')} / {p.get('ece')}**")
          print(f"- Evidence: **{m['evidence']['status']}**")
          PY
      - name: Commit reports
        shell: bash
        run: |
          git config user.name "harbin-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m "backtest: refresh walk-forward market evidence"
            git push
          else
            echo "No backtest changes."
          fi

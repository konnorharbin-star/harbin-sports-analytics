name: Format EA research branch
on:
  push:
    branches:
      - research/ea-player-talent-v1
    paths:
      - 'research/ea_talent/**'
      - '.github/workflows/ea-format-research.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ea-player-talent-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff autoformat and fix import order
        run: |
          python -m pip install ruff
          ruff format research/ea_talent
          ruff check research/ea_talent --fix
          ruff format research/ea_talent
          ruff check research/ea_talent
      - name: Commit formatting corrections
        run: |
          if ! git diff --quiet -- research/ea_talent; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/ea_talent
            git commit -m "Style: format EA talent research code"
            git push origin HEAD:research/ea-player-talent-v1
          fi

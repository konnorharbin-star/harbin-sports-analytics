name: CFB Model + Dashboard

on:
  workflow_dispatch:
    inputs:
      season:
        description: Optional season (blank means next upcoming week)
        required: false
        type: string
      week:
        description: Optional week (blank means next upcoming week)
        required: false
        type: string
  schedule:
    - cron: '17 11,17,23 * * *'
    - cron: '47 14 * * 6'

permissions:
  contents: write

concurrency:
  group: cfb-model-publication
  cancel-in-progress: false

jobs:
  project-fbs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install free model dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify coverage and research contracts
        run: python -m pytest -q tests/test_market_error_challenger.py tests/test_full_fbs_slate.py
      - name: Project entire remaining FBS slate
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$SEASON" || -n "$WEEK" ]]; then
            if [[ -z "$SEASON" || -z "$WEEK" ]]; then
              echo "Provide both season and week or neither." >&2
              exit 1
            fi
            args+=(--season "$SEASON" --week "$WEEK")
          fi
          python run_week.py "${args[@]}"
      - name: Preserve immutable first-seen forecasts
        run: python scripts/archive_first_seen_predictions.py
      - name: Fail if any future FBS matchup is missing
        run: python scripts/audit_schedule_coverage.py
      - name: Verify cross-file publication integrity
        run: python validate_publication.py
      - name: Publish run summary
        shell: bash
        run: |
          echo "### Full FBS slate coverage" >> "$GITHUB_STEP_SUMMARY"
          cat outputs/schedule_coverage_audit.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Predictions are research-only; no automatic sports wagers." >> "$GITHUB_STEP_SUMMARY"
      - name: Save run artifacts even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-forecast-${{ github.run_id }}
          path: |
            outputs/
            docs/latest.csv
            docs/latest.json
            history/first_seen_pregame_predictions.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validated pregame output and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A outputs/ docs/ history/first_seen_pregame_predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified CFB pregame slate and original forecast ledger"
            git push
          fi

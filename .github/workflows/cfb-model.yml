name: CFB Model + Dashboard

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = auto-detect)"
        required: false
        default: ""
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
      history_start:
        description: "First training season (blank = season-5)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore: ["outputs/**", "history/**", "reports/**", "docs/**"]
  schedule:
    - cron: "17 11,17,23 * * *"
    - cron: "47 14 * * 6"
permissions:
  contents: write
concurrency:
  group: cfb-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Run model + monitoring + portfolio controls
        shell: bash
        run: |
          ARGS=""
          [ -n "${{ inputs.season }}" ] && ARGS="$ARGS --season ${{ inputs.season }}"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          [ -n "${{ inputs.history_start }}" ] && ARGS="$ARGS --history-start ${{ inputs.history_start }}"
          python run_week.py $ARGS
      - name: Publish run summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob,json,os
          files=glob.glob("outputs/cfb_model_*_metadata.json")
          if not files: print("## CFB model\nNo metadata file was produced."); raise SystemExit(0)
          m=json.load(open(max(files,key=os.path.getmtime))); mon=m.get("live_monitoring",{}); port=m.get("portfolio",{}); c=m["market_coverage"]; a=m.get("advanced_features",{}); x=m.get("current_context",{}); mi=m.get("market_intelligence",{})
          print(f"## Harbin CFB Platform v6 — {m['season']} Week {m['week']}")
          print(f"- Games: **{m['upcoming_games']}** · ML/Spread/Total: **{c['moneyline']}/{c['spread']}/{c['total']}**")
          print(f"- Margin / Total MAE: **{m['metrics'].get('margin_mae')} / {m['metrics'].get('total_mae')}** · Brier/ECE: **{m['metrics'].get('win_brier')} / {m['metrics'].get('win_ece')}**")
          print(f"- Dynamic advanced coverage: **{a.get('dynamic_coverage',0):.1%}** ({a.get('dynamic_feature_count',0)} features) · Weather: **{x.get('weather_coverage',0):.1%}** · Travel: **{x.get('travel_coverage',0):.1%}**")
          print(f"- Multi-book: **{mi.get('multi_book_coverage',0):.1%}** · The Odds API configured: **{mi.get('odds_api_configured',False)}**")
          print(f"- Live readiness: **{mon.get('live_readiness_score','n/a')}/100** · Portfolio: **{str(port.get('mode','paper')).upper()}** · approved **{port.get('approved_units',0)}u**")
          PY
      - name: Commit generated state
        shell: bash
        run: |
          git config user.name "harbin-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs history reports docs
          if ! git diff --cached --quiet; then git commit -m "model: automated CFB v6 refresh"; git push; else echo "No generated changes to commit."; fi

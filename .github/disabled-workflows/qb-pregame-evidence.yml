name: CFB QB Pregame Evidence Capture (Research)

on:
  workflow_dispatch:
  schedule:
    # Friday through Monday, capturing separate time-stamped evidence snapshots.
    - cron: "25 17 * * 0,4,5,6"
  push:
    branches: [main]
    paths:
      - "research/qb_evidence/**"
      - "tests/test_qb_evidence_capture.py"
      - ".github/workflows/qb-pregame-evidence.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/qb_evidence/**"
      - "tests/test_qb_evidence_capture.py"
      - ".github/workflows/qb-pregame-evidence.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testing dependency
        run: python -m pip install pytest
      - name: Validate identity and cutoff controls
        run: python -m pytest -q tests/test_qb_evidence_capture.py
      - name: Capture upcoming QB evidence from current model
        env:
          SPORT: cfb
          MODEL_PREDICTIONS: "outputs/cfb_model_*.csv"
        run: |
          CAPTURE_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python research/qb_evidence/capture.py \
            --sport "$SPORT" \
            --predictions "$MODEL_PREDICTIONS" \
            --capture-at "$CAPTURE_AT" \
            --csv-output reports/research_qb_evidence_rows.csv \
            --json-output reports/research_qb_evidence_summary.json
      - name: Document uncertainty in run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("reports/research_qb_evidence_summary.json"))
          print("## Research-only pregame QB archive")
          print(f"- Sport: {r['sport']} / upcoming games: {r['upcoming_games']}")
          print(f"- Source game file SHA256: `{r['model_source_sha256']}`")
          print(f"- Evidence states: {r['evidence_states']}")
          print("- This does **not** independently verify any starter or backup.")
          print("- **No** EA-player ratings attached; no score or bet changes.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-pregame-qb-evidence
          path: |
            reports/research_qb_evidence_rows.csv
            reports/research_qb_evidence_summary.json
          retention-days: 90

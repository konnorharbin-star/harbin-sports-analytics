name: CFB Score Error Diagnostics (Research)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/score_error_diagnostics.py"
      - "tests/test_score_error_diagnostics.py"
      - ".github/workflows/score-error-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "scripts/score_error_diagnostics.py"
      - "tests/test_score_error_diagnostics.py"
      - ".github/workflows/score-error-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Verify score decomposition
        run: python -m pytest -q tests/test_score_error_diagnostics.py
      - name: Analyze archived historical forecasts (no refit)
        run: |
          python scripts/score_error_diagnostics.py \
            --sport cfb \
            --source reports/backtest_predictions.csv \
            --json-output reports/score_error_diagnostics.json \
            --tails-output reports/score_error_extreme_games.csv
      - name: Publish research-only summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("reports/score_error_diagnostics.json"))
          m = r["overall"]
          print("## CFB historical score-error diagnostics")
          print(f"- Evidence: {r['evidence_class']}")
          print(f"- Games: {m['games']}")
          print(f"- Margin MAE: {m['margin_mae']:.2f} points")
          print(f"- Total MAE: {m['total_mae']:.2f} points")
          print(f"- Total bias (projected − actual): {m['total_bias']:+.2f} points")
          print("- No score coefficient or bet selection is changed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-score-error-diagnostics
          path: |
            reports/score_error_diagnostics.json
            reports/score_error_extreme_games.csv
          retention-days: 30

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbin Model Audit</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1113;color:#f3f4f5;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:30px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.muted{color:#969ba1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}.card{background:#171a1e;border:1px solid #292d32;border-radius:12px;padding:16px}.k{color:#91979e;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.v{font-size:26px;font-weight:800;margin-top:7px}.good{color:#6fd17a}.warn{color:#e0b34f}.bad{color:#ef7777}table{width:100%;border-collapse:collapse;background:#15181b;border-radius:10px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid #292d32}th{color:#92979d;font-size:11px}a{color:#74a7ff}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#24282d;font-size:12px}.section{margin-top:24px}</style></head><body><div class="wrap"><div class="top"><div><h1>Harbin CFB · Model Audit</h1><div class="muted">Operational readiness, validation, evidence and portfolio controls. This is not a profitability guarantee.</div></div><div><a href="./">← Picks dashboard</a></div></div><div id="status" class="section muted">Loading current audit state…</div><div id="cards" class="grid"></div><div class="section"><h2>Validation</h2><table id="validation"></table></div><div class="section"><h2>Historical betting evidence</h2><div id="evidence" class="card"></div></div><div class="section"><h2>Portfolio gate</h2><div id="portfolio" class="card"></div></div><div class="section"><h2>Operational alerts</h2><div id="alerts" class="card"></div></div></div><script>const get=async f=>{try{let r=await fetch(f+'?t='+Date.now());return r.ok?await r.json():null}catch(e){return null}};const fmt=(x,d=2)=>x==null?'—':Number(x).toFixed(d);const pct=x=>x==null?'—':(100*Number(x)).toFixed(2)+'%';Promise.all([get('metadata.json'),get('live_monitoring.json'),get('evidence.json'),get('policy.json'),get('portfolio_summary.json')]).then(([m,mon,e,p,port])=>{document.getElementById('status').innerHTML=m?`Updated <b>${m.updated_at_ct||m.generated_at}</b> · Season ${m.season} Week ${m.week} · Platform ${m.platform_version||'6.x'}`:'No model metadata yet.';let metrics=m?.metrics||{},cov=m?.market_coverage||{},adv=m?.advanced_features||{},intel=m?.market_intelligence||{};let cards=[['Live readiness',mon?.live_readiness_score,'/100'],['Margin MAE',metrics.margin_mae,' pts'],['Total MAE',metrics.total_mae,' pts'],['Win Brier',metrics.win_brier,''],['Calibration ECE',metrics.win_ece,''],['Market coverage',cov.games?100*Math.min(cov.moneyline||0,cov.spread||0,cov.total||0)/cov.games:null,'%'],['Advanced features',adv.feature_count,' features'],['Multi-book',100*(intel.multi_book_coverage||0),'%'],['Evidence',e?.status||'UNPROVEN',''],['Portfolio',String(port?.mode||p?.deployment_mode||'paper').toUpperCase(),'']];document.getElementById('cards').innerHTML=cards.map(c=>`<div class=card><div class=k>${c[0]}</div><div class=v>${typeof c[1]==='number'?fmt(c[1],c[0].includes('MAE')?2:c[0].includes('Brier')||c[0].includes('ECE')?3:1):c[1]}${c[2]}</div></div>`).join('');document.getElementById('validation').innerHTML=`<tr><th>Metric</th><th>Model</th><th>Baseline</th></tr><tr><td>Margin MAE</td><td>${fmt(metrics.margin_mae)}</td><td>${fmt(metrics.margin_baseline_mae)}</td></tr><tr><td>Total MAE</td><td>${fmt(metrics.total_mae)}</td><td>${fmt(metrics.total_baseline_mae)}</td></tr><tr><td>Brier</td><td>${fmt(metrics.win_brier,4)}</td><td>—</td></tr><tr><td>Log loss</td><td>${fmt(metrics.win_log_loss,4)}</td><td>—</td></tr><tr><td>ECE</td><td>${fmt(metrics.win_ece,4)}</td><td>—</td></tr>`;let o=e?.overall||{};document.getElementById('evidence').innerHTML=e?`<b>${e.status}</b><br><br>Bets: ${o.bets??0} · ROI: ${pct(o.roi)} · Units: ${fmt(o.units)} · Win rate: ${pct(o.win_rate)} · Normalized CLV: ${pct(o.avg_clv)} · 95% block-bootstrap ROI CI: ${JSON.stringify(o.roi_ci_95||[])}<br><br><span class=muted>${e.note||''}</span>`:'Backtest evidence has not been published yet.';document.getElementById('portfolio').innerHTML=`Mode: <b>${String(port?.mode||p?.deployment_mode||'paper').toUpperCase()}</b> · proposed: ${fmt(port?.proposed_units)}u · approved: ${fmt(port?.approved_units)}u<br><span class=muted>Automatic production staking is gated behind historical proof and portfolio exposure limits.</span>`;let alerts=mon?.alerts||[];document.getElementById('alerts').innerHTML=alerts.length?'<ul>'+alerts.map(x=>`<li>${x}</li>`).join('')+'</ul>':'No current operational alerts.'})</script></body></html>
